[package]
name = "echo-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Module seam for EchoAgentCore: manifest + lifecycle + registry"

[dependencies]
tracing = { workspace = true }
serde = { workspace = true }
# `MountContext.config` 是宿主 → 模块的自由载荷（`modules.toml` 的
# `[module.config]` 原样透传）：框架不解释内容，只负责按 id 送到模块手里。
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
echo-context = { workspace = true }

[dev-dependencies]
# 就绪等待/重挂的测试要真跑 async（`mount_when_ready` 是 async）。
tokio = { workspace = true }

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # 与 workspace Cargo.toml 的 rust-version 保持一致。
  RUST_VERSION: "1.98"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      - name: 编译（全部 target）
        run: cargo build --workspace --all-targets --locked

      - name: 测试
        run: cargo test --workspace --locked

      # 证伪测试：最小宿主 + 最小模块能否在**非本应用**的宿主里跑通。
      # 先构建模块二进制（宿主会 spawn 它），再跑宿主；示例内部有 assert，
      # 任何一步不对都非零退出。
      - name: 示例端到端（框架可独立使用的证据）
        run: |
          cargo build --locked -p minimal-module
          cargo run --locked -p minimal-host

      # 跨语言：Python 模块手写帧，不碰 Rust。证明「协议即 ABI」。
      - name: 跨语言模块（Python 走同一份协议）
        run: |
          python3 --version
          cargo test --locked -p echo-module-host --test cross_language

      # clippy 只作为警告展示，不阻断（迁出期先让 CI 稳定；M4 收紧为 -D warnings）
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        continue-on-error: true

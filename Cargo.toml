[workspace]
resolver = "2"
members = [
    # ── 装配层（宿主 + 模块两侧）─────────────────────────────────────────
    "crates/echo-context",
    "crates/echo-module-api",
    "crates/echo-module-loader",
    "crates/echo-module",
    "crates/echo-module-host",
    "crates/echo-module-sdk",
    # 仓库自守门禁（只含 tests/，审计跨 crate 的仓库属性）
    "crates/framework-gates",
    # 示例：证明框架可被任何 Rust 应用使用（M4 的证伪测试）
    "examples/minimal-host",
    "examples/minimal-module",
]

[workspace.package]
version = "0.18.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/echo-fabric-arch"

# 只列**通用第三方库**。本仓不允许出现面向具体应用的依赖
# （由 `crates/framework-gates` 的门禁守着）。
[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# error handling
thiserror = "2"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
async-trait = "0.1"
base64 = "0.22"
dashmap = "6"

# 子进程资源限额（setrlimit）：仅 Unix 生效，见 `echo-module-host::stdio`。
libc = "0.2"

# 本仓内部 crate
echo-context = { path = "crates/echo-context" }
echo-module-api = { path = "crates/echo-module-api" }
echo-module-loader = { path = "crates/echo-module-loader" }
echo-module = { path = "crates/echo-module" }
echo-module-host = { path = "crates/echo-module-host" }
echo-module-sdk = { path = "crates/echo-module-sdk" }

# dev
proptest = "1"
